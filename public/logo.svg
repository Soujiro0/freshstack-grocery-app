<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7a58" />
      <stop offset="50%" stop-color="#1f5e42" />
      <stop offset="100%" stop-color="#164631" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Main Rounded Squircle Background -->
  <rect width="512" height="512" rx="136" fill="url(#greenGradient)" />

  <!-- Subtle Inner Ring Border -->
  <rect width="496" height="496" x="8" y="8" rx="128" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Shopping Cart & Checkmark Icon Group -->
  <g filter="url(#dropShadow)" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cart Handle & Basket Top -->
    <path d="M112 144 h44 l36 160 h152 l32 -112 H184" />
    
    <!-- Left Wheel -->
    <circle cx="204" cy="368" r="26" fill="#ffffff" stroke="none" />
    
    <!-- Right Wheel -->
    <circle cx="332" cy="368" r="26" fill="#ffffff" stroke="none" />

    <!-- Dynamic Checkmark hovering over/inside the cart -->
    <path d="M220 220 l36 36 l76 -76" stroke="#ffffff" stroke-width="36" />
  </g>
</svg>
